name: BidGadget CI Pipeline

on:
  push:
  pull_request:

jobs:

  # =========================
  # JAVA UNIT TEST
  # =========================
  java-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build & Run Java Tests
        run: mvn clean test


  # =========================
  # PHP UNIT TEST
  # =========================
  php-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit tests


  # =========================
  # INTEGRATION TEST
  # =========================
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- JAVA BACKEND ----
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Java Backend
        run: mvn clean compile

      - name: Start Java Backend Server
        run: |
          java -cp target/classes com.bidgadget.BidEngine &
          sleep 5

      # ---- PHP FRONTEND SERVER ----
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Start PHP Server
        run: |
          php -S localhost:8000 -t frontend &
          sleep 3

      # ---- INTEGRATION TEST ----
      - name: Run Integration Test
        run: |
          curl -i -X POST http://localhost:8000/process-bid \
          -H "Content-Type: application/json" \
          -d '{"auction_id":101,"user_id":1,"bid_amount":30000}'