name: BidGadget CI Pipeline

on:
  push:
  pull_request:

jobs:

  # =========================
  # JAVA TEST
  # =========================
  java-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bidgadget

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run Maven Test
        run: mvn clean test


  # =========================
  # PHP TEST
  # =========================
  php-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          tools: phpunit

      - name: Run PHPUnit
        run: phpunit tests


  # =========================
  # INTEGRATION TEST
  # =========================
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ===== JAVA BACKEND =====
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build & Start Java Server
        working-directory: bidgadget
        run: |
          mvn clean compile
          nohup java -cp target/classes com.bidgadget.BidEngine > java.log 2>&1 &
          sleep 6

      # ===== PHP SERVER =====
      - name: Setup PHP Server
        run: |
          nohup php -S localhost:8000 -t . > php.log 2>&1 &
          sleep 4

      # ===== INTEGRATION TEST =====
      - name: Run Integration Test
        run: |
          curl -i -X POST http://localhost:8000/process-bid \
          -H "Content-Type: application/json" \
          -d '{"auction_id":101,"user_id":1,"bid_amount":30000}'