name: BidGadget CI Pipeline

on:
  push:
  pull_request:

jobs:

  # =========================
  # JAVA TEST
  # =========================
  java-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bidgadget   # 🔥 PENTING INI FIX ERROR POM

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run Maven Test
        run: mvn clean test


  # =========================
  # PHP TEST
  # =========================
  php-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Install dependencies
        working-directory: frontend
        run: composer install

      - name: Run PHPUnit
        working-directory: frontend
        run: vendor/bin/phpunit tests


  # =========================
  # INTEGRATION TEST
  # =========================
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build & Run Java Server
        working-directory: bidgadget
        run: |
          mvn clean compile
          java -cp target/classes com.bidgadget.BidEngine &
          sleep 5

      - name: Setup PHP server
        working-directory: frontend
        run: php -S localhost:8000 -t . &

      - name: Run integration test
        run: |
          curl -X POST http://localhost:8000/process-bid \
          -H "Content-Type: application/json" \
          -d '{"auction_id":101,"user_id":1,"bid_amount":30000}'