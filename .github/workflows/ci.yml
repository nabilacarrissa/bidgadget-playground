name: BidGadget CI Pipeline

on:
  push:
  pull_request:

jobs:

  # =========================
  # JAVA UNIT TEST
  # =========================
  java-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run Java Unit Tests
        run: mvn clean test


  # =========================
  # PHP UNIT TEST
  # =========================
  php-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit tests


  # =========================
  # INTEGRATION TEST
  # =========================
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # JAVA BACKEND
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Java
        run: mvn clean compile

      - name: Start Java Server
        run: |
          nohup java -cp target/classes com.bidgadget.BidEngine > java.log 2>&1 &
          sleep 5

      # PHP FRONTEND
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Start PHP Server
        run: |
          nohup php -S 0.0.0.0:8000 -t frontend > php.log 2>&1 &
          sleep 3

      # WAIT + TEST
      - name: Check server is alive
        run: curl -f http://localhost:8000 || true

      - name: Run Integration Test
        run: |
          curl -i -X POST http://localhost:8000/process-bid \
          -H "Content-Type: application/json" \
          -d '{"auction_id":101,"user_id":1,"bid_amount":30000}'